schema: harness-template-v1
version: "0.2.0"
id: web-runtime
name: Web-only runtime workflow
description: >
  Harness template for the Routa.js Web-only application (Next.js).
  Covers TypeScript type checking, ESLint, Vitest, API contract validation,
  and the Web validation pipeline.

topology:
  app_type: web
  runtimes:
    - nextjs
    - node
  protocols:
    - rest
  boundaries:
    - path: src/app/api
      role: http-transport
    - path: src/core
      role: domain-logic
    - path: src/client/components
      role: ui-layer

guides:
  required:
    - path: AGENTS.md
      purpose: Operating contract and read order
    - path: docs/fitness/README.md
      purpose: Executable fitness rulebook
  recommended:
    - path: docs/fitness/web-api-test.md
      purpose: Web API contract test evidence

sensors:
  fitness_manifest: docs/fitness/manifest.yaml
  review_triggers: docs/fitness/review-triggers.yaml
  release_triggers: docs/fitness/release-triggers.yaml
  surfaces:
    - docs/harness/build.yml
    - docs/harness/test.yml
  hard_gates:
    fast:
      - id: eslint_pass
        command: npm run lint
      - id: ts_typecheck_pass
        command: npx tsc --noEmit
      - id: api_contract_check
        command: npm run api:check
    normal:
      - id: vitest_pass
        command: npm run test:run
      - id: api_schema_validate
        command: npm run api:schema:validate
      - id: code_quality
        dimension: code_quality
    full:
      - id: build
        command: npm run build
      - id: e2e
        command: npm run test:e2e
      - id: security
        dimension: security

specialists:
  - id: harness-build
    role: Build surface validation
  - id: harness-test
    role: Test surface validation
  - id: review-trigger-guard
    role: Review gate enforcement

automations:
  ref: docs/harness/automations.yml

lifecycle_tiers:
  fast:
    description: ESLint, TypeScript, API contract (~30s)
    column_gate: coding
  normal:
    description: Vitest, schema validation, code quality (~5min)
    column_gate: review
  full:
    description: Next.js build, E2E, security (~15min)
    column_gate: release

drift:
  strategy: checksum-on-evidence-files
  notify_on:
    - guide_missing
    - sensor_file_missing
    - gate_command_failing
