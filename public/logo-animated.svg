<svg width="560" height="160" viewBox="0 0 560 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Loom</title>
  <desc>The Orbit L mark and Loom wordmark.</desc>
  <defs>
    <linearGradient id="hero-orbit" x1="112" y1="112" x2="402" y2="366" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="signal-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .mark-frame, .wordmark { stroke: #0F172A; }
      .mark-gap { stroke: #F8FAFC; }
      @media (prefers-color-scheme: dark) {
        .mark-frame, .wordmark { stroke: #F8FAFC; }
        .mark-gap { stroke: #0F172A; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow-signal { display: none; }
      }
    </style>
  </defs>

  <g transform="translate(8 4) scale(.30)">
    <path class="mark-frame" d="M132 82V310C132 374 174 416 238 416H402" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="mark-gap" d="M132 184C170 130 232 104 292 118C362 134 402 196 388 258C374 322 314 360 254 350C202 342 160 308 144 264" stroke-width="70" stroke-linecap="round"/>
    <path id="orbit-path" d="M132 184C170 130 232 104 292 118C362 134 402 196 388 258C374 322 314 360 254 350C202 342 160 308 144 264" stroke="url(#hero-orbit)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="132" cy="82" r="15" fill="#3B82F6"/>
    <circle cx="388" cy="258" r="10" fill="#60A5FA"/>
    <circle class="flow-signal" r="8" fill="#DBEAFE" opacity="0" filter="url(#signal-glow)">
      <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#orbit-path"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="wordmark" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 43V114H230"/>
    <circle cx="280" cy="78.5" r="35.5"/>
    <circle cx="371" cy="78.5" r="35.5"/>
    <path d="M430 114V43L461 82L492 43V114"/>
  </g>
</svg>
